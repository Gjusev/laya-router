# Tier configuration for running the backtest on Z.ai (GLM).
# Prices are USD per 1M tokens, as configured for cost estimation:
# - glm-5.3-flash: Z.ai published rates ($0.15 input / $0.50 output)
# - glm-5.3: OpenRouter listing rates ($0.5614 input / $1.764 output);
#   direct z.ai rates may differ — edit to match your billing.
# Usage: make backtest-glm   (needs OPENAI_API_KEY set to a Z.ai key)
cheap:
  model: glm-5.3-flash
  price:
    input_per_m: 0.15
    output_per_m: 0.50
frontier:
  model: glm-5.3
  price:
    input_per_m: 0.5614
    output_per_m: 1.764
